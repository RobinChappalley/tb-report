name: Deploy

on:
  push:
    paths:
      - "picture-tag-website/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/robinchappalley/picture-tag-website:latest ./picture-tag-website
          docker push ghcr.io/robinchappalley/picture-tag-website:latest
      - name: Debug SSH connection
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/key
          chmod 600 /tmp/key
          echo "=== Key line count ==="
          wc -l /tmp/key
          echo "=== SSH verbose ==="
          ssh -vvv -i /tmp/key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo OK" 2>&1 | grep -v "identity file"
          rm /tmp/key


      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "picture-tag-website/docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/deployments/picture-tag-website/"
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/deployments/picture-tag-website
            cd /home/${{ secrets.VPS_USER }}/deployments/picture-tag-website
            docker compose pull
            docker compose up -d --remove-orphans

