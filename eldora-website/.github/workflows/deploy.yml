name: Deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: |-
        ${{
             github.ref_name == 'main' && 'Production'
          || github.ref_name == 'dev'  && 'Staging'
          ||                              'Testing'
        }}
    steps:
      - name: Set up deployment info
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              environment: '${{ vars.ENVIRONMENT_STAGE }}',
              per_page: 1
            }).then((result) => {
              if (result.data.length === 0) {
                return Promise.reject();
              }

              return result.data[0];
            }).then((deployment) => {
              core.setOutput('deployment_id', deployment.id);
              core.setOutput('deployment_url', '${{ vars.ENVIRONMENT_URL }}');
              core.setOutput('deployment_stage', '${{ vars.ENVIRONMENT_STAGE }}');
            });

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install SSH key to deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_SSH_KEY }}

      - name: Update deployment status (in progress)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'in_progress'
            });

      - name: Install frontend dependencies
        run: bun install --no-progress --non-interactive
      - name: Build frontend assets
        run: bun run build
      - name: Deploy to ${{ steps.deployment.outputs.deployment_stage }} environment
        run: bundle exec cap $(echo ${{ steps.deployment.outputs.deployment_stage }} | tr '[:upper:]' '[:lower:]') deploy

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              deployment_url: '${{ steps.deployment.outputs.deployment_url }}',
              state: 'success'
            });
      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'failure'
            });
